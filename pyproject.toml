[project]
name = "prs-effectiveness-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "aioboto3>=15.5.0",
    "aiomysql>=0.3.2",
    "aioodbc>=0.5.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi[all]>=0.136.3",
    "flower>=2.0.1",
    "geoalchemy2>=0.20.0",
    "greenlet>=3.5.0",
    "langchain[openai]>=1.3.1",
    "langgraph>=1.2.1",
    "markitdown[pdf]>=0.1.6",
    "playwright>=1.60.0",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymysql>=1.2.0",
    "pyodbc>=5.3.0",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.49",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["B024", "D", "S101", "ERA001"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.ruff.lint.isort]
force-single-line = false

[dependency-groups]
dev = [
    "ipython>=9.9.0",
    "ruff>=0.14.13",
]

