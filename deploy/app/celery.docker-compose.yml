services:
  celery_worker:
    extends:
      file: compose.common.yml
      service: common
    container_name: prs_eff_celery_worker
    command: celery -A entrypoints.celery:celery_app worker --loglevel=info
    # docker.env переопределяет адреса БД из src/.env на host.docker.internal,
    # когда БД/туннели живут на хост-машине: хостовые localhost/0.0.0.0 изнутри
    # контейнера указывают на сам контейнер. Файл в .gitignore; make up-celery
    # создаёт пустой, если его нет (пустой = адреса src/.env годятся как есть).
    env_file:
      - ../../src/.env
      - ./docker.env
    # На Linux host.docker.internal сам не резолвится (в Docker Desktop — да).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  celery_beat:
    extends:
      file: compose.common.yml
      service: common
    container_name: prs_eff_celery_beat
    command: celery -A entrypoints.celery:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  flower:
    extends:
      file: compose.common.yml
      service: common
    container_name: prs_eff_flower
    command: celery -A entrypoints.celery:celery_app flower --port=5555
    ports:
      - "5556:5555"

networks:
  prs_effectiveness_network:
    name: prs_effectiveness_network