services:
  celery_worker:
    extends:
      file: compose.common.yml
      service: common
    container_name: prs_eff_celery_worker
    command: celery -A entrypoints.celery:celery_app worker --loglevel=info
    # docker.env переопределяет адреса БД из src/.env на host.docker.internal:
    # хостовые localhost/0.0.0.0 изнутри контейнера указывают на сам контейнер.
    env_file:
      - ../../src/.env
      - ./docker.env
    restart: unless-stopped

  celery_beat:
    extends:
      file: compose.common.yml
      service: common
    container_name: prs_eff_celery_beat
    command: celery -A entrypoints.celery:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  flower:
    extends:
      file: compose.common.yml
      service: common
    container_name: prs_eff_flower
    command: celery -A entrypoints.celery:celery_app flower --port=5555
    ports:
      - "5556:5555"

networks:
  prs_effectiveness_network:
    name: prs_effectiveness_network